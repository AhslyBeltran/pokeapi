<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Pokédex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="particles-container" id="particlesContainer"></div>
  <div class="scanlines"></div>

  <div class="device">

    <div class="device-top">
      <div class="led led--red"></div>
      <div class="led led--yellow"></div>
      <div class="led led--green"></div>
    </div>

    <div class="screen">
      <div class="screen-inner">

        <div class="sidebar">
          <div class="logo">
            <div class="logo-icon">
              <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2"/><line x1="2" y1="20" x2="38" y2="20" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="6" fill="currentColor"/></svg>
            </div>
            <span class="logo-text">Pokemon</span>
            <span class="logo-sub">v2.0</span>
          </div>

          <button id="themeToggle" class="theme-toggle">
            <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <span id="themeLabel">CLARO</span>
          </button>

          <div class="search-area">
            <label class="search-label">BUSCAR</label>
            <div class="search-field">
              <input type="text" id="searchInput" placeholder="pikachu, 25..." autocomplete="off">
              <button id="searchBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </button>
            </div>
          </div>

          <div class="stats-panel">
            <div class="stat-panel-item">
              <span class="stat-panel-label">REGISTROS</span>
              <span class="stat-panel-value" id="counterValue">—</span>
            </div>
            <div class="stat-panel-item">
              <span class="stat-panel-label">GENERACIÓN</span>
              <span class="stat-panel-value">I — IX</span>
            </div>
          </div>

          <div class="sidebar-footer">
            <div class="power-indicator">
              <div class="power-dot"></div>
              <span>ONLINE</span>
            </div>
          </div>
        </div>

        <div class="main-area">
          <div class="main-header">
            <div class="main-title-row">
              <h1>Directorio Pokémon</h1>
              <span class="main-count" id="mainCount"></span>
              <button id="battleModeBtn" class="battle-toggle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6"/><path d="M9.5 21.5L3.5 15.5"/><path d="M19.5 7.5L13.5 1.5"/><path d="M11.5 19.5l8-8"/></svg>
                BATALLA
              </button>
            </div>
            <p class="main-subtitle" id="mainSubtitle">Selecciona una especie para inspeccionar</p>
            <div id="battlePickStatus" class="battle-pick-status" style="display: none;">
              <svg class="battle-pick-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6"/><path d="M9.5 21.5L3.5 15.5"/><path d="M19.5 7.5L13.5 1.5"/><path d="M11.5 19.5l8-8"/></svg>
              <span class="battle-pick-msg" id="battlePickMsg">Elige 2 rivales para el combate</span>
              <span class="battle-pick-count" id="battlePickCount">0/2</span>
              <span class="battle-pick-names" id="battlePickNames"></span>
              <button class="battle-pick-clear" id="battlePickClear">LIMPIAR</button>
              <button class="battle-pick-go" id="battlePickGo" disabled>COMBATIR</button>
            </div>
          </div>

          <div id="statusContainer" class="status-msg" style="display: none;"></div>
          <div id="loaderContainer" class="loader-wrap" style="display: none;">
            <div class="loader-bar"><div class="loader-fill"></div></div>
            <span class="loader-text">Escaneando datos...</span>
          </div>

          <div id="pokedexGrid" class="pokedex-grid"></div>

          <div id="loadMoreContainer" class="load-more-container" style="display: none;">
            <button id="loadMoreBtn" class="load-more-btn">
              <span>Cargar más</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
            </button>
          </div>
        </div>

      </div>
    </div>

    <div class="device-bottom">
      <div class="device-btn"></div>
      <div class="device-btn"></div>
      <div class="device-btn device-btn--big"></div>
    </div>

  </div>

  <!-- Modal -->
  <div id="pokemonModal" class="modal" style="display: none;">
    <div class="modal-panel">
      <div class="modal-panel-top">
        <div class="modal-panel-header">
          <button id="closeModal" class="modal-close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <span class="modal-panel-label">FICHA DE ESPECIE</span>
        </div>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Modal Batalla -->
  <div id="battleModal" class="modal" style="display: none;">
    <div class="battle-panel">
      <div class="modal-panel-top">
        <div class="modal-panel-header">
          <button id="closeBattle" class="modal-close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <span class="modal-panel-label">⚔ ARENA DE BATALLA</span>
        </div>
      </div>
      <div id="battleBody" class="battle-body"></div>
    </div>
  </div>

  <script>
    (function() {
      const pokedexGrid = document.getElementById('pokedexGrid');
      const statusContainer = document.getElementById('statusContainer');
      const loaderContainer = document.getElementById('loaderContainer');
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      const loadMoreContainer = document.getElementById('loadMoreContainer');
      const pokemonModal = document.getElementById('pokemonModal');
      const closeModalBtn = document.getElementById('closeModal');
      const modalBody = document.getElementById('modalBody');
      const counterValue = document.getElementById('counterValue');
      const mainCount = document.getElementById('mainCount');
      const battleModeBtn = document.getElementById('battleModeBtn');
      const mainSubtitle = document.getElementById('mainSubtitle');
      const battlePickStatus = document.getElementById('battlePickStatus');
      const battlePickCount = document.getElementById('battlePickCount');
      const battleModal = document.getElementById('battleModal');
      const closeBattleBtn = document.getElementById('closeBattle');
      const battleBody = document.getElementById('battleBody');
      const battlePickMsg = document.getElementById('battlePickMsg');
      const battlePickNames = document.getElementById('battlePickNames');
      const battlePickClear = document.getElementById('battlePickClear');
      const battlePickGo = document.getElementById('battlePickGo');
      const mainArea = document.querySelector('.main-area');
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const themeLabel = document.getElementById('themeLabel');
      const particlesContainer = document.getElementById('particlesContainer');

      let allPokemon = [];
      let currentPokemonData = [];
      let loadedCount = 0;
      const POKEMON_PER_PAGE = 60;
      const MAX_POKEMON = 1025;
      let isLoading = false;
      let searchTimeout = null;
      let battleMode = false;
      let battleSelection = [];
      const pokemonCache = new Map();

      function showStatus(message, isError = false) {
        statusContainer.textContent = message;
        statusContainer.style.display = 'block';
        statusContainer.className = isError ? 'status-msg status-msg--error' : 'status-msg';
        loaderContainer.style.display = 'none';
      }

      function hideStatus() { statusContainer.style.display = 'none'; }

      function showLoader() {
        loaderContainer.style.display = 'flex';
        statusContainer.style.display = 'none';
      }

      function hideLoader() { loaderContainer.style.display = 'none'; }

      async function fetchPokemonData(url) {
        if (pokemonCache.has(url)) return pokemonCache.get(url);
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('Error');
          const data = await response.json();
          pokemonCache.set(url, data);
          return data;
        } catch (e) {
          return null;
        }
      }

      function renderPokemonList(pokemonArray, append = false) {
        if (!pokemonArray || pokemonArray.length === 0) {
          if (!append) { pokedexGrid.innerHTML = ''; showStatus('Sin resultados', true); }
          return;
        }
        hideStatus();
        if (!append) pokedexGrid.innerHTML = '';

        pokemonArray.forEach((pokemon, idx) => {
          const card = document.createElement('div');
          card.className = 'pokemon-card';
          card.dataset.pokemonId = pokemon.id;
          card.style.animationDelay = `${(idx % 20) * 30}ms`;

          const id = pokemon.id.toString().padStart(4, '0');
          const spriteUrl = pokemon.sprites?.other?.['official-artwork']?.front_default ||
                            pokemon.sprites?.front_default || '';
          const types = pokemon.types.map(t => t.type.name);
          const primaryType = types[0] || 'normal';

          card.innerHTML = `
            <div class="card-left">
              <img class="card-sprite" src="${spriteUrl}" alt="${pokemon.name}" loading="lazy"
                   onerror="this.style.opacity='0.3'">
            </div>
            <div class="card-right">
              <span class="card-id">${id}</span>
              <span class="card-name">${pokemon.name}</span>
              <div class="card-types">${types.map(t => `<span class="card-type type-${t}">${t}</span>`).join('')}</div>
            </div>
            <div class="card-accent type-accent-${primaryType}"></div>
            <span class="card-select-badge">+</span>
          `;

          card.addEventListener('click', () => {
            if (battleMode) {
              toggleBattleSelection(pokemon.id, card);
            } else {
              openPokemonModal(pokemon.id);
            }
          });
          pokedexGrid.appendChild(card);
        });

        if (battleMode) refreshCardBadges();
        mainCount.textContent = `${pokedexGrid.children.length} / ${allPokemon.length}`;
      }

      async function loadInitialPokemon() {
        showLoader();
        try {
          const response = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${MAX_POKEMON}`);
          if (!response.ok) throw new Error();
          const data = await response.json();
          allPokemon = data.results.map((item, i) => ({ name: item.name, url: item.url, id: i + 1 }));
          counterValue.textContent = allPokemon.length;
          await loadPokemonBatch(0, POKEMON_PER_PAGE);
          hideLoader();
        } catch (e) {
          hideLoader();
          showStatus('Error de conexión', true);
        }
      }

      async function loadPokemonBatch(startIndex, count) {
        if (isLoading) return;
        isLoading = true;
        showLoader();
        const batch = allPokemon.slice(startIndex, startIndex + count);
        const results = await Promise.all(batch.map(item => fetchPokemonData(item.url)));
        const valid = results.filter(Boolean).sort((a, b) => a.id - b.id);
        currentPokemonData = [...currentPokemonData, ...valid];
        renderPokemonList(valid, true);
        loadedCount = startIndex + count;
        loadMoreContainer.style.display = loadedCount < allPokemon.length ? 'block' : 'none';
        hideLoader();
        isLoading = false;
      }

      async function loadMore() {
        if (loadedCount >= allPokemon.length) return;
        await loadPokemonBatch(loadedCount, POKEMON_PER_PAGE);
      }

      function performSearch() {
        const query = searchInput.value.trim();
        if (!query) {
          currentPokemonData = [];
          loadedCount = 0;
          loadPokemonBatch(0, POKEMON_PER_PAGE);
          return;
        }
        const term = query.toLowerCase();
        const filtered = allPokemon.filter(p =>
          p.name.toLowerCase().includes(term) || p.id.toString() === term
        );
        if (!filtered.length) {
          pokedexGrid.innerHTML = '';
          showStatus(`"${query}" no encontrado`, true);
          loadMoreContainer.style.display = 'none';
          mainCount.textContent = '0 resultados';
          return;
        }
        loadMoreContainer.style.display = 'none';
        pokedexGrid.innerHTML = '';
        currentPokemonData = [];
        loadPokemonBatchDirect(filtered);
      }

      async function loadPokemonBatchDirect(list) {
        showLoader();
        const results = await Promise.all(list.map(item => fetchPokemonData(item.url)));
        const valid = results.filter(Boolean).sort((a, b) => a.id - b.id);
        currentPokemonData = valid;
        renderPokemonList(valid);
        hideLoader();
      }

      async function openPokemonModal(pokemonId) {
        pokemonModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        modalBody.innerHTML = '<div class="modal-loader"><div class="loader-bar"><div class="loader-fill"></div></div></div>';

        try {
          const pokemon = await fetchPokemonData(`https://pokeapi.co/api/v2/pokemon/${pokemonId}`);
          if (!pokemon) { modalBody.innerHTML = '<p class="modal-error">Error al cargar</p>'; return; }

          const species = await fetchPokemonData(pokemon.species.url);
          const id = pokemon.id.toString().padStart(4, '0');
          const spriteUrl = pokemon.sprites?.other?.['official-artwork']?.front_default || pokemon.sprites?.front_default || '';
          const types = pokemon.types.map(t => t.type.name);
          const primaryType = types[0] || 'normal';

          const stats = pokemon.stats.map(stat => {
            const val = stat.base_stat;
            const pct = Math.min(val / 1.8, 100);
            const cls = val >= 100 ? 'high' : val >= 60 ? 'mid' : 'low';
            return `
              <div class="m-stat">
                <div class="m-stat-head">
                  <span class="m-stat-name">${stat.stat.name.replace('-', ' ')}</span>
                  <span class="m-stat-val">${val}</span>
                </div>
                <div class="m-stat-track"><div class="m-stat-fill ${cls}" style="width:${pct}%"></div></div>
              </div>`;
          }).join('');

          const abilities = pokemon.abilities.map(a =>
            `<span class="m-tag">${a.ability.name.replace('-', ' ')}</span>`
          ).join('');

          const moves = pokemon.moves.slice(0, 8).map(m =>
            `<span class="m-tag m-tag--accent">${m.move.name.replace('-', ' ')}</span>`
          ).join('');

          const genera = species?.genera?.find(g => g.language.name === 'es');
          const flavor = species?.flavor_text_entries?.find(f => f.language.name === 'es')?.flavor_text?.replace(/[\n\f]/g, ' ') || '';
          const description = genera?.genus || flavor;

          const evoChain = await getEvolutionChain(species);

          modalBody.innerHTML = `
            <div class="m-hero type-bg-${primaryType}">
              <div class="m-hero-sprite">
                <img src="${spriteUrl}" alt="${pokemon.name}">
              </div>
              <div class="m-hero-info">
                <span class="m-hero-id">#${id}</span>
                <h2 class="m-hero-name">${pokemon.name}</h2>
                <div class="m-hero-types">${types.map(t => `<span class="card-type type-${t}">${t}</span>`).join('')}</div>
              </div>
            </div>

            ${description ? `<div class="m-desc">${description}</div>` : ''}

            <div class="m-grid">
              <div class="m-grid-item">
                <span class="m-grid-label">ALTURA</span>
                <span class="m-grid-val">${(pokemon.height / 10).toFixed(1)}m</span>
              </div>
              <div class="m-grid-item">
                <span class="m-grid-label">PESO</span>
                <span class="m-grid-val">${(pokemon.weight / 10).toFixed(1)}kg</span>
              </div>
              <div class="m-grid-item">
                <span class="m-grid-label">EXP. BASE</span>
                <span class="m-grid-val">${pokemon.base_experience || '—'}</span>
              </div>
            </div>

            <div class="m-section">
              <h3 class="m-section-title">Estadísticas base</h3>
              <div class="m-stats">${stats}</div>
            </div>

            <div class="m-section">
              <h3 class="m-section-title">Habilidades</h3>
              <div class="m-tags">${abilities}</div>
            </div>

            <div class="m-section">
              <h3 class="m-section-title">Movimientos</h3>
              <div class="m-tags">${moves}</div>
            </div>

            ${evoChain ? `
              <div class="m-section">
                <h3 class="m-section-title">Evolución</h3>
                <div class="m-evo">${evoChain}</div>
              </div>` : ''}
          `;
        } catch (e) {
          modalBody.innerHTML = '<p class="modal-error">Error al cargar datos</p>';
        }
      }

      async function getEvolutionChain(species) {
        try {
          const url = species?.evolution_chain?.url;
          if (!url) return null;
          const data = await fetchPokemonData(url);
          if (!data) return null;

          const chain = [];
          let cur = data.chain;
          while (cur) {
            const name = cur.species.name;
            const pkm = await fetchPokemonData(`https://pokeapi.co/api/v2/pokemon/${name}`);
            if (pkm) {
              chain.push({
                name,
                sprite: pkm.sprites?.other?.['official-artwork']?.front_default || pkm.sprites?.front_default || ''
              });
            }
            cur = cur.evolves_to?.[0] || null;
          }
          if (chain.length <= 1) return null;
          return chain.map((p, i) => `
            <div class="m-evo-item">
              <img class="m-evo-sprite" src="${p.sprite}" alt="${p.name}">
              <span class="m-evo-name">${p.name}</span>
              ${i < chain.length - 1 ? '<span class="m-evo-arrow">→</span>' : ''}
            </div>
          `).join('');
        } catch { return null; }
      }

      function closeModal() {
        pokemonModal.style.display = 'none';
        document.body.style.overflow = 'auto';
      }

      function closeBattleModal() {
        battleModal.style.display = 'none';
        document.body.style.overflow = 'auto';
        exitBattleMode();
      }

      function setBattleMode(active) {
        battleMode = active;
        battleSelection = [];
        battleModeBtn.classList.toggle('battle-toggle--active', active);
        battlePickStatus.style.display = active ? 'flex' : 'none';
        mainSubtitle.textContent = active
          ? 'Selecciona 2 rivales para el combate'
          : 'Selecciona una especie para inspeccionar';
        hideStatus();
        updateBattlePickUI();
        refreshCardBadges();
      }

      function toggleBattleMode() {
        setBattleMode(!battleMode);
      }

      function exitBattleMode() {
        setBattleMode(false);
      }

      function pkmShortName(id) {
        return allPokemon[id - 1]?.name || `#${id}`;
      }

      function updateBattlePickUI() {
        battlePickCount.textContent = `${battleSelection.length}/2`;
        battlePickMsg.textContent = battleSelection.length === 0
          ? 'Elige 2 rivales para el combate'
          : battleSelection.length === 1
            ? 'Elige al segundo rival'
            : '¡Listos para combatir!';
        const names = battleSelection.map(id =>
          `<span class="pick-chip">${pkmShortName(id)}</span>`
        ).join('');
        battlePickNames.innerHTML = names;
        battlePickNames.style.display = battleSelection.length ? 'flex' : 'none';
        battlePickGo.disabled = battleSelection.length !== 2;
      }

      function refreshCardBadges() {
        document.querySelectorAll('.pokemon-card').forEach(card => {
          const id = Number(card.dataset.pokemonId);
          const data = card.__pokeData || {};
          card.classList.toggle('pokemon-card--selected', battleSelection.includes(id));
          card.classList.toggle('pokemon-card--battle', battleMode);
          const badge = card.querySelector('.card-select-badge');
          if (badge) {
            const idx = battleSelection.indexOf(id);
            badge.textContent = idx === -1 ? '+' : idx + 1;
            badge.classList.toggle('card-select-badge--on', idx !== -1);
          }
        });
      }

      function toggleBattleSelection(id, card) {
        const idx = battleSelection.indexOf(id);
        if (idx !== -1) {
          battleSelection.splice(idx, 1);
        } else {
          if (battleSelection.length >= 2) {
            showStatus('Ya hay 2 rivales seleccionados: pulsa COMBATIR o LIMPIAR', true);
            return;
          }
          battleSelection.push(id);
        }
        refreshCardBadges();
        updateBattlePickUI();
      }

      function clearBattleSelection() {
        battleSelection = [];
        refreshCardBadges();
        updateBattlePickUI();
        hideStatus();
      }

      async function startBattle(idA, idB) {
        let pkmA, pkmB;
        setBattleMode(false);
        try {
          pkmA = await fetchPokemonData(`https://pokeapi.co/api/v2/pokemon/${idA}`);
          pkmB = await fetchPokemonData(`https://pokeapi.co/api/v2/pokemon/${idB}`);
        } catch (e) {
          pkmA = null;
        }
        if (!pkmA || !pkmB) {
          showStatus('No se pudieron cargar los luchadores. Intenta de nuevo.', true);
          return;
        }
        battleModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        renderBattleArena(pkmA, pkmB);
        simulateBattle(pkmA, pkmB);
      }

      function combatant(pkm) {
        const stat = n => pkm.stats.find(s => s.stat.name === n)?.base_stat || 10;
        return {
          id: pkm.id,
          name: pkm.name,
          sprite: pkm.sprites?.other?.['official-artwork']?.front_default || pkm.sprites?.front_default || '',
          hpMax: stat('hp'),
          hp: stat('hp'),
          attack: (stat('attack') + stat('special-attack')) / 2,
          defense: (stat('defense') + stat('special-defense')) / 2,
          speed: stat('speed'),
          level: 50
        };
      }

      function renderBattleArena(pkmA, pkmB) {
        battleBody.innerHTML = `
          <div class="arena">
            <div class="fighter fighter--left" id="fighterA">
              <div class="fighter-hud">
                <span class="fighter-name">${pkmA.name}</span>
                <div class="hp-track"><div class="hp-fill" id="hpBarA" style="width:100%"></div></div>
                <span class="hp-text" id="hpTextA">${pkmA.stats.find(s => s.stat.name === 'hp').base_stat}</span>
              </div>
              <img class="fighter-sprite" id="spriteA" src="${combatant(pkmA).sprite}" alt="${pkmA.name}">
            </div>
            <div class="vs-badge">VS</div>
            <div class="fighter fighter--right" id="fighterB">
              <img class="fighter-sprite" id="spriteB" src="${combatant(pkmB).sprite}" alt="${pkmB.name}">
              <div class="fighter-hud">
                <span class="fighter-name">${pkmB.name}</span>
                <div class="hp-track"><div class="hp-fill" id="hpBarB" style="width:100%"></div></div>
                <span class="hp-text" id="hpTextB">${pkmB.stats.find(s => s.stat.name === 'hp').base_stat}</span>
              </div>
            </div>
          </div>
          <div class="battle-log" id="battleLog"></div>
          <div class="battle-actions">
            <button class="battle-btn" id="battleRematch">REVANCHA</button>
            <button class="battle-btn battle-btn--ghost" id="battleClose">CERRAR</button>
          </div>
        `;

        document.getElementById('battleRematch').addEventListener('click', () => {
          document.getElementById('battleLog').innerHTML = '';
          simulateBattle(pkmA, pkmB);
        });
        const closeQ = document.getElementById('battleClose');
        if (closeQ) closeQ.addEventListener('click', closeBattleModal);
      }

      function logBattle(container, msg) {
        const p = document.createElement('div');
        p.className = 'log-line';
        p.textContent = msg;
        container.appendChild(p);
        container.scrollTop = container.scrollHeight;
      }

      function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
      }

      async function simulateBattle(pkmA, pkmB) {
        const A = combatant(pkmA);
        const B = combatant(pkmB);
        const hpBarA = document.getElementById('hpBarA');
        const hpBarB = document.getElementById('hpBarB');
        const hpTextA = document.getElementById('hpTextA');
        const hpTextB = document.getElementById('hpTextB');
        const spriteA = document.getElementById('spriteA');
        const spriteB = document.getElementById('spriteB');
        const log = document.getElementById('battleLog');
        if (!log) return;

        log.innerHTML = '';
        logBattle(log, `¡${A.name} vs ${B.name} comienzan la batalla!`);

        const turnOrder = A.speed >= B.speed ? [A, B] : [B, A];
        let first = turnOrder[0];
        let second = turnOrder[1];
        let round = 0;

        while (A.hp > 0 && B.hp > 0 && round < 200) {
          round++;
          await sleep(850);
          await battleTurn(first, second, log, {
            hpBarA, hpBarB, hpTextA, hpTextB, spriteA, spriteB, side: first === A ? 'A' : 'B'
          });
          if (second.hp <= 0) break;
          await sleep(850);
          await battleTurn(second, first, log, {
            hpBarA, hpBarB, hpTextA, hpTextB, spriteA, spriteB, side: second === A ? 'A' : 'B'
          });
        }

        const winner = A.hp > B.hp ? A : B;
        const loser = winner === A ? B : A;
        logBattle(log, `💥 ¡${loser.name} se debilitó!`);
        logBattle(log, `🏆 ¡${winner.name} gana la batalla!`);

        const winBox = winner === A ? document.getElementById('fighterA') : document.getElementById('fighterB');
        if (winBox) {
          winBox.classList.add('fighter--winner');
          await sleep(400);
          winBox.classList.remove('fighter--winner');
        }
      }

      function calculateDamage(atk, def) {
        const base = (atk / (def * 0.6 + 10)) * 22;
        const variance = 0.8 + Math.random() * 0.4;
        return Math.max(1, Math.floor(base * variance));
      }

      async function battleTurn(attacker, defender, log, ui) {
        const dmg = calculateDamage(attacker.attack, defender.defense);
        defender.hp = Math.max(0, defender.hp - dmg);

        const atkSprite = ui.side === 'A' ? ui.spriteA : ui.spriteB;
        const defSprite = ui.side === 'A' ? ui.spriteB : ui.spriteA;
        const isLeft = ui.side === 'A';

        atkSprite.classList.add(isLeft ? 'strike-left' : 'strike-right');
        defSprite.classList.add('take-hit');
        await sleep(280);
        atkSprite.classList.remove(isLeft ? 'strike-left' : 'strike-right');
        defSprite.classList.remove('take-hit');

        const defBar = ui.side === 'A' ? ui.hpBarB : ui.hpBarA;
        const defText = ui.side === 'A' ? ui.hpTextB : ui.hpTextA;
        const alive = defender.hp > 0;

        defBar.style.width = `${(defender.hp / defender.hpMax) * 100}%`;
        defBar.className = 'hp-fill ' + (alive
          ? (defender.hp / defender.hpMax) > 0.5 ? 'hp-fill--ok' : (defender.hp / defender.hpMax) > 0.2 ? 'hp-fill--mid' : 'hp-fill--crit'
          : 'hp-fill--empty');
        defText.textContent = defender.hp;

        if (!alive) defSprite.classList.add('fainted');
        logBattle(log, `${attacker.name} ataca y causa ${dmg} de daño a ${defender.name}`);
      }

      function init() {
        loadInitialPokemon();

        // Theme toggle
        const savedTheme = localStorage.getItem('pokedex-theme') || 'dark';
        if (savedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
          themeLabel.textContent = 'OSCURO';
        }

        themeToggle.addEventListener('click', () => {
          const isLight = document.documentElement.getAttribute('data-theme') === 'light';
          if (isLight) {
            document.documentElement.removeAttribute('data-theme');
            themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
            themeLabel.textContent = 'CLARO';
            localStorage.setItem('pokedex-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
            themeLabel.textContent = 'OSCURO';
            localStorage.setItem('pokedex-theme', 'light');
          }
        });

        // Pokéball particles
        function createParticle() {
          const particle = document.createElement('div');
          particle.className = 'particle';
          const size = 14 + Math.random() * 18;
          const left = Math.random() * 100;
          const duration = 12 + Math.random() * 18;
          const delay = Math.random() * 2;
          particle.style.left = left + '%';
          particle.style.animationDuration = duration + 's';
          particle.style.animationDelay = delay + 's';
          particle.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="3.5"/></svg>`;
          particlesContainer.appendChild(particle);
          setTimeout(() => particle.remove(), (duration + delay) * 1000);
        }

        function spawnParticles() {
          createParticle();
          setTimeout(spawnParticles, 1500 + Math.random() * 2000);
        }
        spawnParticles();
        battleModeBtn.addEventListener('click', toggleBattleMode);
        battlePickGo.addEventListener('click', () => {
          if (battleSelection.length === 2) startBattle(battleSelection[0], battleSelection[1]);
        });
        battlePickClear.addEventListener('click', clearBattleSelection);
        closeBattleBtn.addEventListener('click', closeBattleModal);
        battleModal.addEventListener('click', e => { if (e.target === battleModal) closeBattleModal(); });
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); performSearch(); } });
        searchInput.addEventListener('input', () => {
          clearTimeout(searchTimeout);
          searchTimeout = setTimeout(performSearch, 300);
        });
        loadMoreBtn.addEventListener('click', loadMore);
        closeModalBtn.addEventListener('click', closeModal);
        pokemonModal.addEventListener('click', e => { if (e.target === pokemonModal) closeModal(); });
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            if (battleModal.style.display === 'flex') closeBattleModal();
            else closeModal();
          }
        });
        mainArea.addEventListener('scroll', () => {
          if (isLoading || loadedCount >= allPokemon.length) return;
          if (mainArea.scrollTop + mainArea.clientHeight >= mainArea.scrollHeight - 300) loadMore();
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else { init(); }
    })();
  </script>
</body>
</html>
